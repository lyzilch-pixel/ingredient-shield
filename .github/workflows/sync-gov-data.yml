name: 同步国家公开数据（定期）

# 定期从公开公告格式数据源清洗生成 gov_products.json，并发布到 docs/ 供 GitHub Pages 运行时拉取。
# 设计：零运行时服务器 —— GitHub Pages 仅静态托管；"定期同步" 由本 Actions 工作流完成，
# 同步后提交 gov_products.json 到仓库，Pages 自动重建并生效。
on:
  schedule:
    # 每周一 02:17 UTC 执行（避开整点高峰）
    - cron: "17 2 * * 1"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发
  # 推送 sync 脚本 / 样例 feed 时也会自动跑一次，便于即时验证
  push:
    paths:
      - "skills/ingredient-shield/engine/sync_gov_data.py"
      - "skills/ingredient-shield/data/gov_feed_sample.csv"

permissions:
  contents: write   # 需要写权限以提交同步结果

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行同步脚本
        env:
          # 若设置了名为 GOV_FEED_URL 的仓库 Secret（指向你授权的真实公开 feed，支持 .json/.csv），
          # 同步脚本会改用该远程数据源；未设置则使用内置样例 feed。
          SOURCE_URL: ${{ secrets.GOV_FEED_URL }}
        run: |
          python3 skills/ingredient-shield/engine/sync_gov_data.py

      - name: 发布到 docs/（Pages 运行时拉取位置）
        run: |
          cp skills/ingredient-shield/data/gov_products.json docs/gov_products.json

      - name: 提交变更（如有）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/ingredient-shield/data/gov_products.json docs/gov_products.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交。"
          else
            git commit -m "chore: 定期同步国家公开数据 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
